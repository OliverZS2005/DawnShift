<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Clash</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1f29; --panel2: #232836; --line: #2e3446;
    --text: #e8ebf2; --muted: #8a93a8; --gold: #f5c542; --green: #4ade80;
    --red: #f87171; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  .money { font-size: 22px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .rate { color: var(--green); font-variant-numeric: tabular-nums; }
  .mode { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .mode.mp { border-color: var(--blue); color: var(--blue); }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: var(--panel); }
  nav button.active { background: var(--gold); color: #111; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--gold); color: #111; font-weight: 700; border: none; }
  button.danger { border-color: var(--red); color: var(--red); }
  input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; }
  label { display: block; margin-top: 10px; color: var(--muted); font-size: 13px; }
  main { padding: 16px; max-width: 1000px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .muted { color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); }
  .equipped, .current { border-color: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr.you { color: var(--gold); font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--green); }
  #arenaWrap { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 10; flex-direction: column; gap: 8px; padding: 8px; }
  canvas { background: #0d1017; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; touch-action: none; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; display: none; z-index: 20; }
  .log { max-height: 180px; overflow: auto; font-size: 13px; }
  .log div { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .win { color: var(--green); } .loss { color: var(--red); }
  .choice { cursor: pointer; text-align: left; padding: 14px; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #2a2410; border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .locked { opacity: .55; }
  .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
  .lvl { font-size: 12px; color: var(--blue); }
  .choice b { display: block; font-size: 15px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>💰 Cash Clash</h1>
  <div><div class="money" id="money">$0</div><div class="rate" id="rate">+$0/s</div></div>
  <span class="mode" id="modePill">Singleplayer</span>
  <nav>
    <button data-tab="play" class="active">🎮 Play</button>
    <button data-tab="tycoon">🏭 Tycoon</button>
    <button data-tab="armory">🔫 Armory</button>
    <button data-tab="battle">⚔️ Battle</button>
    <button data-tab="reboot">🔄 Reboot</button>
  </nav>
</header>
<main id="view"></main>
<div id="arenaWrap">
  <div id="hud" class="muted"></div>
  <canvas id="cv" width="900" height="560"></canvas>
  <div class="muted">WASD / arrows move · Mouse aim · Click/hold shoot · R reload · 1-5 switch weapon</div>
</div>
<div id="toast"></div>

<script src="shared.js"></script>
<script>
const { BUILDINGS, WEAPONS, STATS, MAX_LVL, fmt } = CC;
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3000); }

// ---------- Singleplayer save (exactly one slot; it can only be reset, never duplicated) ----------
const RIVAL_NAMES = ['xXSniperXx','MoneyMike','LemonLord','BigBankBob','NoScopeNina','TycoonTina','RocketRay','CashCarl','SprayPray','GoldGabe','FrugalFred','OilBaronOz','SpaceSam','PennyPia','CoinKing','ShotgunSue','ArcadeAce','FactoryFay','RichRick','DollarDee','BrokeBen','JackpotJo','VaultVic','StonksSteve'];
const freshSP = () => ({
  tycoon: CC.newTycoon(),
  rivals: RIVAL_NAMES.map((n, i) => ({ name: n, money: Math.round(30 * Math.pow(1.75, i) * (0.7 + Math.random() * 0.6)), skill: 0.3 + Math.random() * 0.6, recent: 0 })),
  wins: 0, losses: 0, log: [], last: Date.now(),
});
let SP = store.get('cc_sp');
if (!SP) { const old = store.get('cashclash'); SP = freshSP(); if (old) { SP.tycoon = CC.sanitizeTycoon(old); Object.assign(SP, { rivals: old.rivals || SP.rivals, wins: old.wins || 0, losses: old.losses || 0, log: old.log || [] }); } }
SP.tycoon = CC.upgradeSave(SP.tycoon);
{ const earned = CC.offlineEarnings(SP.tycoon, (Date.now() - SP.last) / 1000); if (earned > 1) { SP.tycoon.money += earned; setTimeout(() => toast(`Welcome back! Offline earnings: ${fmt(earned)}`), 300); } }
const saveSP = () => { SP.last = Date.now(); store.set('cc_sp', SP); };
function resetSP() {
  if (!confirm('Reset your whole singleplayer game? Money, buildings, weapons and record will be wiped. This cannot be undone.')) return;
  SP = freshSP(); saveSP(); toast('Singleplayer game reset'); render();
}

// ---------- Multiplayer connection ----------
const defaultServer = location.protocol.startsWith('http') ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host : 'ws://localhost:8080';
const normUrl = u => { u = u.trim().replace(/\/+$/, ''); if (!/^wss?:\/\//.test(u)) u = (u.startsWith('localhost') || /^[\d.]+(:\d+)?$/.test(u) ? 'ws://' : 'wss://') + u.replace(/^https?:\/\//, ''); return u; };
const tokens = () => store.get('cc_tokens') || {};
let NET = null; // { ws, url, state, board, you, online, server, queue, match }
let pendingChoice = null; // url waiting for "new vs import" choice
let mode = 'sp';

function connect(url, choice) {
  url = normUrl(url);
  const token = tokens()[url];
  if (!token && !choice) { pendingChoice = url; return render(); }
  pendingChoice = null;
  if (NET) NET.ws.close();
  let ws;
  try { ws = new WebSocket(url); } catch { return toast('Invalid server address'); }
  const n = NET = { ws, url, state: null, board: [], queue: 'idle', connecting: true };
  render();
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', token, mode: choice, name: store.get('cc_name') || '', tycoon: choice === 'import' ? SP.tycoon : undefined }));
  ws.onmessage = e => onNet(n, JSON.parse(e.data));
  ws.onclose = () => { if (NET !== n) return; NET = null; if (mode === 'mp') { mode = 'sp'; toast('Disconnected from server — back to singleplayer'); } if (G && G.mp) closeArena(); render(); };
  ws.onerror = () => toast('Could not reach ' + url);
}
const netSend = m => NET && NET.ws.readyState === 1 && NET.ws.send(JSON.stringify(m));
function onNet(n, m) {
  if (m.type === 'welcome') {
    const t = tokens(); t[n.url] = m.token; store.set('cc_tokens', t);
    Object.assign(n, { connecting: false, state: m.state, server: m.server }); mode = 'mp'; tab = 'tycoon'; toast(`Joined ${m.server}`); render();
  } else if (m.type === 'needMode') { const url = n.url; NET = null; n.ws.close(); const t = tokens(); delete t[url]; store.set('cc_tokens', t); pendingChoice = url; toast('This server has no profile for you yet'); render(); }
  else if (m.type === 'state') { n.state = m.state; }
  else if (m.type === 'board') { Object.assign(n, { board: m.board, you: m.you, online: m.online }); if (tab === 'battle' && mode === 'mp') renderSoon(); }
  else if (m.type === 'queue') { n.queue = m.status; const el = $('#mm'); if (el) el.textContent = m.status === 'searching' ? `Searching… ${m.wait.toFixed(1)}s · range ±${m.window.toFixed(2)} orders of magnitude · ${m.inQueue} in queue` : ''; }
  else if (m.type === 'match') { n.queue = 'idle'; openArena({ mp: true, you: m.you, oppName: m.opp.name, pot: m.pot }); }
  else if (m.type === 'snap') { if (G && G.mp) onSnap(m.snap, m.ack); }
  else if (m.type === 'event') eventToast(m.event);
  else if (m.type === 'result') { showResult(m.won, `${m.won ? 'Beat' : 'Lost to'} ${m.opp} → ${m.won ? '+' : '-'}${fmt(m.amount)}${m.reason ? ` (${m.reason})` : ''}`); }
  else if (m.type === 'toast') toast(m.msg);
  else if (m.type === 'error') toast(m.msg);
}

// Current tycoon + how to act on it, depending on mode.
const T = () => mode === 'mp' && NET?.state ? NET.state.tycoon : SP.tycoon;
function act(a) {
  if (mode === 'mp') return netSend({ type: 'action', action: a });
  const err = CC.applyAction(SP.tycoon, a); if (err) toast(err); saveSP();
}

// ---------- UI ----------
let tab = 'play';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
let renderQueued = false;
const renderSoon = () => { if (!renderQueued) { renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function render() {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
  const pill = $('#modePill'); pill.className = 'mode' + (mode === 'mp' ? ' mp' : ''); pill.textContent = mode === 'mp' ? `🌐 ${NET?.server || 'Multiplayer'}` : '💻 Singleplayer';
  const v = $('#view'), t = T();
  if (tab === 'play') v.innerHTML = renderPlay();
  else if (tab === 'tycoon') v.innerHTML = eventBanner(t) + `<p class="muted"><b class="lvl">${CC.LEVELS[t.level - 1]}</b> · income x${CC.globalMult(t).toFixed(2)} · Owning 25/50/100/200 of a building doubles its output each time.</p>
    <div class="grid">${BUILDINGS.map(b => !CC.unlocked(t, b) ? `
      <div class="card locked"><h3>🔒 ${b.icon} ${b.name}</h3><div class="muted">Unlocks at business level ${b.unlock}: <b>${CC.LEVELS[b.unlock - 1]}</b>. Reboot to get there.</div></div>` : `
      <div class="card">
        <h3>${b.icon} ${b.name} <span class="tag">x${CC.owned(t, b.id)}</span> <span class="tag">Lv ${CC.bLevel(t, b.id)}</span></h3>
        <div class="muted">Total ${fmt(CC.bIncome(t, b))}/s${CC.nextMilestone(CC.owned(t, b.id)) ? ` · next x2 at ${CC.nextMilestone(CC.owned(t, b.id))} owned` : ' · all milestones!'}</div>
        <div class="row"><button data-a='{"type":"buy","id":"${b.id}"}' ${t.money < CC.bCost(t, b) ? 'disabled' : ''}>Buy · ${fmt(CC.bCost(t, b))}</button>
        <button data-a='{"type":"bup","id":"${b.id}"}' ${CC.owned(t, b.id) && t.money >= CC.bUpCost(t, b) ? '' : 'disabled'}>Upgrade x2 · ${fmt(CC.bUpCost(t, b))}</button></div>
      </div>`).join('')}</div>`;
  else if (tab === 'armory') v.innerHTML = `<p class="muted">Buy weapons and upgrade them. You bring your <b>equipped</b> weapon into battle and can switch to any other owned weapon with keys 1-5.</p>
    <div class="grid">${WEAPONS.map(w => {
      const own = t.weapons[w.id];
      return `<div class="card ${t.equipped === w.id ? 'equipped' : ''}">
        <h3>${w.icon} ${w.name}</h3>
        <div class="muted">${w.dmg * w.pellets} dmg/shot · ${w.rate}/s · mag ${w.mag}${w.splash ? ' · splash' : ''}</div>
        ${own ? Object.keys(STATS).map(st => `<div class="row"><span>${STATS[st]} <span class="tag">${own[st]}/${MAX_LVL}</span></span>
          <button data-a='{"type":"wup","id":"${w.id}","stat":"${st}"}' ${own[st] >= MAX_LVL || t.money < CC.upCost(t, w, st) ? 'disabled' : ''}>${own[st] >= MAX_LVL ? 'MAX' : fmt(CC.upCost(t, w, st))}</button></div>`).join('') +
          `<div class="row"><span></span><button data-a='{"type":"equip","id":"${w.id}"}' ${t.equipped === w.id ? 'disabled' : ''}>${t.equipped === w.id ? 'Equipped' : 'Equip'}</button></div>`
        : `<div class="row"><span></span><button class="primary" data-a='{"type":"wbuy","id":"${w.id}"}' ${t.money < w.price ? 'disabled' : ''}>Buy · ${fmt(w.price)}</button></div>`}
      </div>`; }).join('')}</div>`;
  else if (tab === 'reboot') v.innerHTML = renderReboot(t);
  else v.innerHTML = mode === 'mp' ? renderBattleMP() : renderBattleSP();
  updateMoney();
}

function eventBanner(t) {
  if (!t.event || t.event.until < Date.now()) return '';
  const e = CC.EVENTS[t.event.type], left = Math.ceil((t.event.until - Date.now()) / 1000);
  return `<div class="banner"><span>${e.icon} <b>${e.name}</b> — ${e.desc} <span class="muted">(${left}s)</span></span>${t.event.type === 'crate' ? `<button class="primary" data-a='{"type":"claim"}'>Claim ${fmt(Math.max(100, CC.income(t) * 90))}</button>` : ''}</div>`;
}
function eventToast(type) { const e = CC.EVENTS[type]; toast(`${e.icon} ${e.name}! ${e.desc}`); if (tab === 'tycoon') render(); }

function renderReboot(t) {
  const cost = CC.rebootCost(t), pct = Math.min(100, t.money / cost * 100), top = t.level >= CC.MAX_BIZ;
  const next = CC.BUILDINGS.filter(b => b.unlock === t.level + 1);
  return `<div class="grid">
    <div class="card current"><h3>🔄 ${top ? 'Prestige reboot' : 'Reboot to the next business level'}</h3>
      <p>Current level: <b class="lvl">${t.level}/${CC.MAX_BIZ} · ${CC.LEVELS[t.level - 1]}</b>${t.prestige ? ` · Prestige ${t.prestige}` : ''}</p>
      <p class="muted">Rebooting wipes your <b>money, buildings and weapons</b>. ${top
        ? `At the top level, each reboot gives <b>Boost Points</b> (more if you overshoot the goal). You'd get <b>${CC.prestigePoints(t)}</b> right now.`
        : `You'll reach <b>${CC.LEVELS[t.level]}</b>: income x2 forever${next.length ? `, and you unlock ${next.map(b => b.icon + ' ' + b.name).join(', ')}` : ''}.`}</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><span>${fmt(t.money)} / ${fmt(cost)}</span>
        <button class="primary" data-reboot ${t.money >= cost ? '' : 'disabled'}>${top ? 'Prestige!' : 'Reboot'}</button></div>
    </div>
    <div class="card"><h3>📈 Levels</h3><table>${CC.LEVELS.map((n, i) => `<tr class="${i + 1 === t.level ? 'you' : ''}"><td>${i + 1 <= t.level ? '✅' : '🔒'}</td><td>${n}</td><td class="muted">x${Math.pow(2, i)} income</td></tr>`).join('')}</table></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>⭐ Boost Points: ${t.points}</h3>
    <p class="muted">${top ? 'Spend points on permanent perks. They survive every reboot and work in battle too.' : `Reach level ${CC.MAX_BIZ} (${CC.LEVELS[CC.MAX_BIZ - 1]}) to earn Boost Points.`}</p>
    <div class="grid">${Object.entries(CC.PERKS).map(([k, p]) => `<div class="card"><h3>${p.icon} ${p.name} <span class="tag">${CC.perk(t, k)}/${p.max}</span></h3>
      <div class="muted">${p.desc} per level</div>
      <div class="row"><span></span><button data-a='{"type":"perk","id":"${k}"}' ${CC.perk(t, k) >= p.max || t.points < CC.perkCost(t, k) ? 'disabled' : ''}>${CC.perk(t, k) >= p.max ? 'MAX' : `${CC.perkCost(t, k)} pt`}</button></div></div>`).join('')}</div>
  </div>`;
}

function renderPlay() {
  const t = SP.tycoon, known = Object.keys(tokens());
  const choice = pendingChoice ? `
    <div class="card current" style="margin-top:12px"><h3>Joining ${esc(pendingChoice)}</h3>
      <p class="muted">You don't have a profile on this server yet. How do you want to start?</p>
      <div class="grid">
        <button class="choice" data-join="new"><b>🆕 New multiplayer tycoon</b><span class="muted">Start from $50 with a pistol. Only used on this server; your singleplayer game is untouched.</span></button>
        <button class="choice" data-join="import"><b>📦 Import my singleplayer tycoon</b><span class="muted">Copy your ${fmt(t.money)}, ${BUILDINGS.reduce((s, b) => s + CC.owned(t, b.id), 0)} buildings and ${Object.keys(t.weapons).length} weapons to this server. Singleplayer keeps its own copy.</span></button>
      </div>
      <div class="row"><span></span><button data-cancel-join>Cancel</button></div>
    </div>` : '';
  return `<div class="grid">
    <div class="card ${mode === 'sp' ? 'current' : ''}"><h3>💻 Singleplayer</h3>
      <p class="muted">Runs entirely on your PC. Fight computer rivals. You have one singleplayer game — you can reset it, but not make another.</p>
      <p>${fmt(t.money)} · ${fmt(CC.income(t))}/s · ${SP.wins}W / ${SP.losses}L</p>
      <div class="row"><button class="primary" data-sp ${mode === 'sp' ? 'disabled' : ''}>${mode === 'sp' ? 'Playing' : 'Play singleplayer'}</button>
      <button class="danger" data-reset>Reset singleplayer game</button></div>
    </div>
    <div class="card ${mode === 'mp' ? 'current' : ''}"><h3>🌐 Multiplayer</h3>
      ${NET && !NET.connecting ? `<p>Connected to <b>${esc(NET.server)}</b> as <b>${esc(NET.state?.name)}</b> · ${NET.online || 1} online</p>
        <div class="row"><button data-mp ${mode === 'mp' ? 'disabled' : ''}>${mode === 'mp' ? 'Playing' : 'Resume multiplayer'}</button><button data-disconnect>Disconnect</button></div>`
      : `<p class="muted">Battle real players. Join any server — anyone can host one with <code>npm start</code>.</p>
        <label>Server address</label><input id="srv" value="${esc(store.get('cc_server') || defaultServer)}" list="srvList">
        <datalist id="srvList">${known.map(u => `<option value="${esc(u)}">`).join('')}</datalist>
        <label>Your name</label><input id="nm" maxlength="16" value="${esc(store.get('cc_name') || '')}" placeholder="Player">
        <div class="row"><span class="muted">${NET?.connecting ? 'Connecting…' : ''}</span><button class="primary" data-connect>Join server</button></div>`}
    </div>
  </div>${choice}`;
}

function renderBattleSP() {
  const ladder = [...SP.rivals, { name: 'YOU', money: SP.tycoon.money, you: true }].sort((a, b) => b.money - a.money);
  const w = WEAPONS.find(x => x.id === SP.tycoon.equipped);
  return `<div class="grid">
    <div class="card"><h3>⚔️ Find a match <span class="tag">vs computer</span></h3>
      <p class="muted">Matchmaking finds the rival whose money is closest to yours. Win: take <b class="win">10%</b> of their money. Lose: they take <b class="loss">10%</b> of yours.</p>
      <p>Record: <b class="win">${SP.wins}W</b> / <b class="loss">${SP.losses}L</b> · ${w.icon} ${w.name}</p>
      <button class="primary" id="queue">Search for opponent</button>
      <div id="mm" class="muted" style="margin-top:8px"></div>
      <h3 style="margin-top:14px">Battle log</h3>
      <div class="log">${SP.log.slice(-20).reverse().map(l => `<div class="${l.w ? 'win' : 'loss'}">${esc(l.t)}</div>`).join('') || '<span class="muted">No battles yet.</span>'}</div>
    </div>
    <div class="card"><h3>🏆 Leaderboard</h3><table>${ladder.map((r, i) => `<tr class="${r.you ? 'you' : ''}"><td>#${i + 1}</td><td>${r.name}${r.you ? ` <span class="lvl">L${SP.tycoon.level}</span>` : ''}</td><td>${fmt(r.money)}</td></tr>`).join('')}</table></div>
  </div>`;
}
function renderBattleMP() {
  const s = NET.state, searching = NET.queue === 'searching';
  return `<div class="grid">
    <div class="card"><h3>⚔️ Find a match <span class="tag">online · ${NET.online || 1} players</span></h3>
      <p class="muted">Matched with the queued player closest to your wealth; the range widens the longer you wait. Win: take <b class="win">10%</b> of their money. Lose: they take <b class="loss">10%</b> of yours.</p>
      <p>Record: <b class="win">${s.wins}W</b> / <b class="loss">${s.losses}L</b></p>
      <button class="primary" id="queue" ${searching ? 'style="display:none"' : ''}>Search for opponent</button>
      <button id="cancelQ" ${searching ? '' : 'style="display:none"'}>Cancel search</button>
      <div id="mm" class="muted" style="margin-top:8px"></div>
    </div>
    <div class="card"><h3>🏆 Server leaderboard</h3><table>${NET.board.map((r, i) => `<tr class="${r.id === NET.you ? 'you' : ''}"><td>#${i + 1}</td><td><span class="dot ${r.online ? 'on' : ''}"></span>${esc(r.name)} <span class="lvl">L${r.level || 1}${r.prestige ? '★' + r.prestige : ''}</span></td><td>${fmt(r.money)}</td><td class="muted">${r.wins}W/${r.losses}L</td></tr>`).join('')}</table></div>
  </div>`;
}

$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.a) { act(JSON.parse(d.a)); if (mode === 'sp') render(); }
  else if ('reset' in d) resetSP();
  else if ('reboot' in d) { const t = T(); if (confirm(t.level < CC.MAX_BIZ ? `Reboot to ${CC.LEVELS[t.level]}? You lose all money, buildings and weapons.` : `Prestige for ${CC.prestigePoints(t)} Boost Points? You lose all money, buildings and weapons.`)) { act({ type: 'reboot' }); toast('🔄 Rebooted!'); if (mode === 'sp') render(); } }
  else if ('sp' in d) { mode = 'sp'; render(); }
  else if ('mp' in d) { mode = 'mp'; render(); }
  else if ('disconnect' in d) { const n = NET; NET = null; mode = 'sp'; n.ws.close(); render(); }
  else if ('connect' in d) { const url = $('#srv').value, nm = $('#nm').value.trim(); store.set('cc_server', url); store.set('cc_name', nm); connect(url); }
  else if (d.join) connect(pendingChoice, d.join);
  else if ('cancelJoin' in d) { pendingChoice = null; render(); }
  else if (b.id === 'queue') { if (mode === 'mp') { netSend({ type: 'queue' }); NET.queue = 'searching'; render(); } else startQueueSP(); }
  else if (b.id === 'cancelQ') { netSend({ type: 'cancel' }); NET.queue = 'idle'; render(); }
});

// ---------- Singleplayer matchmaking ----------
let queueTimer;
function startQueueSP() {
  if (SP.tycoon.money < 10) return toast('You need at least $10 to battle');
  $('#queue').disabled = true;
  const t0 = performance.now();
  clearInterval(queueTimer);
  queueTimer = setInterval(() => {
    const w = (performance.now() - t0) / 1000, mm = $('#mm');
    if (!mm || mode !== 'sp') return clearInterval(queueTimer);
    mm.textContent = `Searching… ${w.toFixed(1)}s (range ±${CC.searchWindow(w).toFixed(2)} orders of magnitude)`;
    if (w < 0.8) return;
    // recently fought rivals count as further away so you don't face the same one every time
    const best = SP.rivals.map(r => ({ r, d: CC.wealthDistance(r.money, SP.tycoon.money) + (r.recent > 0 ? 0.5 : 0) })).sort((a, b) => a.d - b.d)[0];
    if (best.d <= CC.searchWindow(w)) { clearInterval(queueTimer); mm.innerHTML = `Matched with <b>${best.r.name}</b> (${fmt(best.r.money)})`; setTimeout(() => openArena({ mp: false, rival: best.r }), 700); }
  }, 100);
}
// Rival loadout derives from their wealth, so richer opponents are tougher.
function rivalLoadout(r) {
  const affordable = WEAPONS.filter(w => w.price <= r.money * 0.6);
  const w = affordable[Math.max(0, affordable.length - 1 - (Math.random() < .35 ? 1 : 0))] || WEAPONS[0];
  const lvl = Math.max(0, Math.min(MAX_LVL, Math.floor(Math.log10(Math.max(10, r.money)) * 1.3 - 2 + Math.random() * 2)));
  const up = { dmg: lvl, rate: lvl, mag: lvl, armor: lvl };
  return { weapons: { [w.id]: up }, equipped: w.id };
}

// ---------- Arena (shared by both modes) ----------
const cv = $('#cv'), cx = cv.getContext('2d');
const keys = {}, mouse = { x: 0, y: 0, down: false };
let G = null, oneShot = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (!G) return;
  if (e.key >= '1' && e.key <= '5') oneShot.sw = WEAPONS[+e.key - 1].id;
  if (e.key.toLowerCase() === 'r') oneShot.reload = true;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * cv.width / r.width; mouse.y = (e.clientY - r.top) * cv.height / r.height; });
cv.addEventListener('pointerdown', e => { mouse.down = true; cv.dispatchEvent(new PointerEvent('pointermove', e)); });
addEventListener('pointerup', () => mouse.down = false);

const readMove = () => ({
  mx: (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0),
  my: (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0),
});
function readInput(me) {
  const inp = {
    ...readMove(),
    ang: me ? Math.atan2(mouse.y - me.y, mouse.x - me.x) : 0, shoot: mouse.down, ...oneShot,
  };
  oneShot = {}; return inp;
}

// ----- Lag smoothing (multiplayer) -----
// * Own player: client-side prediction. Every input gets a sequence number; the server echoes the
//   last one it applied. We take the server's position and re-apply our not-yet-acknowledged
//   inputs with the same movement code the server uses, then ease the drawn position toward it.
// * Opponent / bullets: drawn INTERP_DELAY behind the newest server state, blended between the
//   two snapshots around that moment, so 30Hz updates and network jitter look smooth.
const INTERP_DELAY = 0.1;
function onSnap(snap, ack) {
  const g = G; g.buf.push({ snap, at: performance.now() });
  while (g.buf.length > 2 && g.buf[1].snap.t < snap.t - 1) g.buf.shift();
  g.pending = g.pending.filter(p => p.seq > ack);
}
const lerp = (a, b, k) => a + (b - a) * k;
const lerpAng = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; };
function predictMe(g) {
  const latest = g.buf[g.buf.length - 1].snap, u = latest.u[g.you], p = { x: u.x, y: u.y };
  const walls = CC.MAPS[latest.m].walls;
  for (const inp of g.pending) CC.moveUnit(walls, p, inp.mx, inp.my, u.sp, CC.TICK);
  // plus the movement held since the last send, so we move every frame, not every 1/30s
  if (g.live) CC.moveUnit(walls, p, g.live.mx, g.live.my, u.sp, g.live.dt);
  return p;
}
function interpolatedView(g, dt) {
  const last = g.buf[g.buf.length - 1];
  const rt = last.snap.t + (performance.now() - last.at) / 1000 - INTERP_DELAY;
  let i = g.buf.length - 1; while (i > 0 && g.buf[i].snap.t > rt) i--;
  const s0 = g.buf[i].snap, s1 = (g.buf[i + 1] || g.buf[i]).snap;
  const k = s1.t > s0.t ? Math.max(0, Math.min(1, (rt - s0.t) / (s1.t - s0.t))) : 1;
  const u = s1.u.map((b, j) => ({ ...last.snap.u[j], x: lerp(s0.u[j].x, b.x, k), y: lerp(s0.u[j].y, b.y, k), ang: lerpAng(s0.u[j].ang, b.ang, k) }));
  // own player: prediction, eased so server corrections never look like teleports
  const target = predictMe(g);
  if (!g.me || Math.hypot(g.me.x - target.x, g.me.y - target.y) > 120) g.me = target;
  else { const e = Math.min(1, dt * 18); g.me = { x: lerp(g.me.x, target.x, e), y: lerp(g.me.y, target.y, e) }; }
  u[g.you] = { ...last.snap.u[g.you], x: g.me.x, y: g.me.y, ang: g.myAng ?? last.snap.u[g.you].ang };
  const age = Math.max(0, rt - s0.t);
  return { m: last.snap.m, u, b: s0.b.map(([x, y, big, vx, vy]) => [x + vx * age, y + vy * age, big]), fx: s0.fx };
}

function openArena(opts) {
  G = { ...opts, over: false, buf: [], pending: [], seq: 0 };
  if (!opts.mp) { G.you = 0; G.oppName = opts.rival.name; G.A = CC.newArena(SP.tycoon, rivalLoadout(opts.rival)); G.pot = { win: opts.rival.money * CC.STEAL, lose: SP.tycoon.money * CC.STEAL }; }
  $('#arenaWrap').style.display = 'flex';
  let last = performance.now(), sendT = 0;
  const g = G;
  (function loop(now) {
    if (G !== g) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let view = null;
    if (g.mp) {
      if (g.buf.length) {
        const held = readMove();
        g.live = { ...held, dt: Math.min(sendT + dt, CC.TICK) };
        view = interpolatedView(g, dt);
        g.myAng = Math.atan2(mouse.y - g.me.y, mouse.x - g.me.x);
        if (!g.over && (sendT += dt) >= CC.TICK) {
          sendT = 0;
          const inp = readInput(g.me); inp.seq = ++g.seq;
          g.pending.push({ seq: inp.seq, mx: inp.mx, my: inp.my });
          netSend({ type: 'input', input: inp });
        }
      }
    } else {
      if (!g.over) {
        const w = CC.stepArena(g.A, [readInput(g.A.units[0]), CC.botInput(g.A, 1, g.rival.skill)], dt);
        if (w >= 0) endSP(w === 0);
      }
      view = CC.snapshot(g.A);
    }
    if (view) draw(view);
    requestAnimationFrame(loop);
  })(last);
}
function endSP(won) {
  const r = G.rival; let t;
  SP.rivals.forEach(x => x.recent = Math.max(0, x.recent - 1)); r.recent = 3;
  if (won) { const gain = r.money * CC.STEAL; r.money -= gain; SP.tycoon.money += gain; SP.wins++; t = `Beat ${r.name} → +${fmt(gain)}`; }
  else { const loss = SP.tycoon.money * CC.STEAL; SP.tycoon.money -= loss; r.money += loss; SP.losses++; t = `Lost to ${r.name} → -${fmt(loss)}`; }
  SP.log.push({ t, w: won }); SP.log = SP.log.slice(-50); saveSP();
  showResult(won, t);
}
function showResult(won, text) {
  if (!G) return;
  G.over = true; G.result = { won, text };
  setTimeout(closeArena, 2500);
}
function closeArena() { $('#arenaWrap').style.display = 'none'; G = null; render(); }

function draw(s) {
  const { W, H } = CC, map = CC.MAPS[s.m];
  cx.clearRect(0, 0, W, H);
  cx.strokeStyle = '#1a1f2b';
  for (let x = 0; x < W; x += 40) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
  for (let y = 0; y < H; y += 40) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  cx.fillStyle = '#3a4258'; map.walls.forEach(w => cx.fillRect(...w));
  s.u.forEach((u, i) => {
    const mine = i === G.you;
    cx.save(); cx.translate(u.x, u.y); cx.rotate(u.ang); cx.fillStyle = '#ccc'; cx.fillRect(4, -3, 20, 6); cx.restore();
    cx.fillStyle = mine ? '#f5c542' : '#f87171'; cx.beginPath(); cx.arc(u.x, u.y, 14, 0, 7); cx.fill();
    cx.fillStyle = '#000a'; cx.fillRect(u.x - 20, u.y - 28, 40, 5); cx.fillStyle = mine ? '#4ade80' : '#f87171'; cx.fillRect(u.x - 20, u.y - 28, 40 * u.hp / u.mhp, 5);
  });
  cx.fillStyle = '#ffe28a'; s.b.forEach(([x, y, big]) => { cx.beginPath(); cx.arc(x, y, big ? 5 : 3, 0, 7); cx.fill(); });
  s.fx.forEach(([x, y, r, t]) => { cx.fillStyle = `rgba(255,150,50,${t * 2})`; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); });
  const me = s.u[G.you], op = s.u[1 - G.you], wi = id => WEAPONS.find(w => w.id === id);
  $('#hud').innerHTML = `<span class="muted">🗺️ ${map.name}</span> · <b style="color:var(--gold)">YOU</b> ${wi(me.g.id).icon} ${wi(me.g.id).name} · ${me.g.rl ? 'Reloading…' : `${me.g.ammo}/${me.g.mag}`} · HP ${me.hp}/${me.mhp}
    &nbsp; vs &nbsp; <b style="color:var(--red)">${esc(G.oppName)}</b> ${wi(op.g.id).icon} ${wi(op.g.id).name} · HP ${op.hp}/${op.mhp}
    &nbsp;·&nbsp; Win <span class="win">+${fmt(G.pot.win)}</span> / Lose <span class="loss">-${fmt(G.pot.lose)}</span>`;
  if (G.result) {
    cx.fillStyle = '#000b'; cx.fillRect(0, 0, W, H);
    cx.fillStyle = G.result.won ? '#4ade80' : '#f87171'; cx.font = 'bold 48px system-ui'; cx.textAlign = 'center';
    cx.fillText(G.result.won ? 'VICTORY' : 'DEFEAT', W / 2, H / 2 - 10);
    cx.font = '22px system-ui'; cx.fillStyle = '#fff'; cx.fillText(G.result.text, W / 2, H / 2 + 30);
  }
}

// ---------- Main loop ----------
function updateMoney() { const t = T(); $('#money').textContent = fmt(t.money); $('#rate').textContent = `+${fmt(CC.income(t))}/s`; }
let lastTick = performance.now(), saveT = 0, renderT = 0, eventT = 0;
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  // Singleplayer keeps earning in the background even while you're on a server.
  SP.tycoon.money += CC.income(SP.tycoon) * dt;
  for (const r of SP.rivals) r.money *= 1 + 0.0015 * dt * (0.5 + r.skill);
  if ((eventT += dt) >= 1) { eventT = 0; const ev = CC.rollEvent(SP.tycoon); if (ev && mode === 'sp') eventToast(ev); }
  updateMoney();
  if ((saveT += dt) > 5) { saveT = 0; saveSP(); }
  if ((renderT += dt) > 1 && (tab === 'tycoon' || tab === 'armory' || tab === 'reboot') && !G) { renderT = 0; render(); }
}, 100);
addEventListener('beforeunload', saveSP);
render();
</script>
</body>
</html>
