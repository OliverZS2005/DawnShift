<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dawnshift</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#" data-view="team">Dawn<span>shift</span></a>
    <nav class="tabs" aria-label="Sections">
      <button data-view="team">Team</button>
      <button data-view="board">Board</button>
      <button data-view="files">Files</button>
      <button data-view="settings">Settings</button>
    </nav>
    <button class="needs-you" id="needs-you" hidden></button>
  </header>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
