<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Your team of AI coworkers. Works with Claude, ChatGPT, Grok, Gemini, Groq and more.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dawnshift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Dawnshift</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#" data-view="team">Dawn<span>shift</span></a>
    <nav class="tabs" aria-label="Sections">
      <button data-view="team">Team</button>
      <button data-view="board">Board</button>
      <button data-view="files">Files</button>
      <button data-view="settings">Settings</button>
    </nav>
    <button class="needs-you" id="needs-you" hidden></button>
  </header>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // Plain old JavaScript on purpose: this must run even on browsers too old
    // for the app, to explain why instead of showing a blank page.
    (function () {
      var ok = window.structuredClone && window.CompressionStream && window.crypto && crypto.subtle &&
        window.indexedDB && window.HTMLDialogElement && AbortSignal.timeout && HTMLFormElement.prototype.requestSubmit;
      if (ok) return;
      window.dawnshiftUnsupported = true;
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
      document.getElementById('main').innerHTML = '<div class="page"><h1>Your browser is too old for Dawnshift</h1>' +
        '<p class="lede">' + (ios
          ? 'Dawnshift needs iOS 16.4 or newer. Update your iPhone in Settings &rarr; General &rarr; Software Update, then open this page again.'
          : 'Update your browser (Chrome, Edge, Firefox or Safari) to the latest version, then open this page again.') + '</p></div>';
    })();
  </script>
  <dialog id="dialog"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
