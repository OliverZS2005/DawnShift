# Builds the Cash Clash desktop app (Godot) for Windows, Mac and Linux on every change to Cash Clash,
# and publishes them as the "cashclash-latest" release (Releases page). A release, unlike workflow
# artifacts, doesn't count against the account's Actions storage quota.
name: Cash Clash desktop

on:
  push:
    branches: [claude/optimistic-dirac-563sig]
    paths: ['cashclash/**', '.github/workflows/cashclash-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cashclash-desktop
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashclash/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo /tmp/godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp && sudo mv /tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSLo /tmp/templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir && unzip -q /tmp/templates.tpz -d /tmp && mv /tmp/templates/* $dir/

      - name: Check desktop/models.json matches models.js
        run: node ../tools/build-models.js --check

      - name: Import project (models, textures, skies, fonts)
        run: godot --headless --import --path .

      - name: Check desktop rules match the web rules
        run: |
          godot --headless --path . --script res://tests/parity.gd > /tmp/parity.txt 2>&1
          node tests/parity.js /tmp/parity.txt

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/mac
          godot --headless --path . --export-release "Windows Desktop" build/windows/CashClash.exe
          godot --headless --path . --export-release "Linux" build/linux/CashClash.x86_64
          godot --headless --path . --export-release "macOS" build/mac/CashClash.zip
          ls -la build/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p out
          cp build/windows/CashClash.exe out/CashClash-Windows.exe
          cp build/linux/CashClash.x86_64 out/CashClash-Linux.x86_64
          cp build/mac/CashClash.zip out/CashClash-Mac.zip
          cat > notes.md <<'EOF'
          Cash Clash for your computer. Pick the file for your system:

          | Computer | File |
          |---|---|
          | Windows | `CashClash-Windows.exe` |
          | Mac (Apple chip or Intel) | `CashClash-Mac.zip` |
          | Linux | `CashClash-Linux.x86_64` |

          **Windows:** open the `.exe`. If Windows says it protected your PC, click **More info → Run anyway**.

          **Mac:** unzip it, then right-click **Cash Clash** and choose **Open**, then **Open** again (it isn't signed with a paid Apple certificate).

          **Linux:** make it executable (`chmod +x CashClash-Linux.x86_64`) and run it.

          Singleplayer works offline. For multiplayer and syncing with the web version, join a Cash Clash server from the Play tab.
          EOF
          gh release delete cashclash-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create cashclash-latest out/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Cash Clash desktop (build $RUN)" \
            --notes-file notes.md
