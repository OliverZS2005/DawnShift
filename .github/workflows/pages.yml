name: Deploy Pages

on:
  push:
    branches:
      - claude/minecraft-skin-3d-converter-4qzsws
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: minecraft-skin-3d-converter

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
