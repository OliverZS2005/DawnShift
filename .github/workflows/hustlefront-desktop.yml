# Builds the Hustlefront app (Godot) for Windows, Mac, Linux, Android and iPhone on every change to the
# game, and publishes them as the "hustlefront-latest" release (Releases page). The iPhone app is compiled
# by a second, short job on a Mac (only Xcode can), from the Xcode project the first job exports. A release, unlike workflow
# artifacts, doesn't count against the account's Actions storage quota.
name: Hustlefront desktop

on:
  push:
    branches: [claude/optimistic-dirac-563sig]
    paths: ['cashclash/**', '.github/workflows/hustlefront-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hustlefront-desktop
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashclash/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo /tmp/godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp && sudo mv /tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSLo /tmp/templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir && unzip -q /tmp/templates.tpz -d /tmp && mv /tmp/templates/* $dir/
          # the runner's Android SDK and Java 17, for the Android export
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME_17_X64" > ~/.config/godot/$f
          done

      - name: Check desktop/models.json matches models.js
        run: node ../tools/build-models.js --check

      - name: Import project (models, textures, skies, fonts)
        run: godot --headless --import --path .

      - name: Check desktop rules match the web rules
        run: |
          godot --headless --path . --script res://tests/parity.gd > /tmp/parity.txt 2>&1
          node tests/parity.js /tmp/parity.txt

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/mac
          godot --headless --path . --export-release "Windows Desktop" build/windows/Hustlefront.exe
          godot --headless --path . --export-release "Linux" build/linux/Hustlefront.x86_64
          godot --headless --path . --export-release "macOS" build/mac/Hustlefront.zip
          ls -la build/*

      # The APK must be signed with the same key every time, or Android won't install a new build over the
      # last one. With the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets set, that's
      # your key; otherwise the workflow makes one the first time and keeps it in the Actions cache (private
      # to this repo; it's dropped if no build runs for a week, and then the next APK needs a fresh install).
      - name: Signing key (cached)
        uses: actions/cache@v4
        with:
          path: ~/.android-key
          key: hustlefront-android-key-v1

      - name: Export for Android
        env:
          RUN: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=$(keytool -list -keystore /tmp/release.keystore -storepass "$KEYSTORE_PASS" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          else
            mkdir -p ~/.android-key
            if [ ! -f ~/.android-key/release.keystore ]; then
              openssl rand -hex 24 > ~/.android-key/pass
              keytool -genkeypair -keystore ~/.android-key/release.keystore -alias hustlefront -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$(cat ~/.android-key/pass)" -keypass "$(cat ~/.android-key/pass)" -dname "CN=Hustlefront" > /dev/null
            fi
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android-key/release.keystore GODOT_ANDROID_KEYSTORE_RELEASE_USER=hustlefront
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$(cat ~/.android-key/pass)"
          fi
          # every build a higher version, so Android installs it as an update
          sed -i "s/^version\/code=.*/version\/code=$RUN/; s/^version\/name=.*/version\/name=\"1.$RUN\"/" export_presets.cfg
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/Hustlefront.apk
          ls -la build/android

      # The iPhone app: Godot writes an Xcode project here; the iphone job below compiles it on a Mac.
      - name: Export for iPhone (Xcode project)
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/Hustlefront.ipa
          ls -la build/ios

      - uses: actions/upload-artifact@v4
        with:
          name: hustlefront-ios-project
          path: cashclash/desktop/build/ios
          retention-days: 1 # only for the iphone job; keeps the Actions storage quota free

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p out
          cp build/windows/Hustlefront.exe out/Hustlefront-Windows.exe
          cp build/linux/Hustlefront.x86_64 out/Hustlefront-Linux.x86_64
          cp build/mac/Hustlefront.zip out/Hustlefront-Mac.zip
          cp build/android/Hustlefront.apk out/Hustlefront-Android.apk
          cat > notes.md <<'EOF'
          Hustlefront for your computer or phone. Pick the file for your system:

          | Device | File |
          |---|---|
          | Windows | `Hustlefront-Windows.exe` |
          | Mac (Apple chip or Intel) | `Hustlefront-Mac.zip` |
          | Linux | `Hustlefront-Linux.x86_64` |
          | Android phone or tablet (64-bit, Android 7+) | `Hustlefront-Android.apk` |
          | iPhone or iPad (iOS 14+) | `Hustlefront-iPhone.ipa` (added a few minutes after the others) |

          **Windows:** open the `.exe`. If Windows says it protected your PC, click **More info → Run anyway**.

          **Mac:** unzip it, then right-click **Hustlefront** and choose **Open**, then **Open** again (it isn't signed with a paid Apple certificate).

          **Linux:** make it executable (`chmod +x Hustlefront-Linux.x86_64`) and run it.

          **Android:** open this page on your phone, tap `Hustlefront-Android.apk`, then open the download. Android asks you to allow installs from your browser the first time (**Settings → Install unknown apps**). New builds install over the old one and keep your game.

          **iPhone:** Apple only lets signed apps onto an iPhone, so the `.ipa` gets signed with your own Apple ID while you install it. On a computer, install [Sideloadly](https://sideloadly.io) (Windows or Mac), plug in your iPhone, drop `Hustlefront-iPhone.ipa` on it and sign in with your Apple ID. Then on the iPhone: **Settings → General → VPN & Device Management**, trust your Apple ID, and turn on **Settings → Privacy & Security → Developer Mode**. With a free Apple ID the app runs for 7 days, then install it again the same way (your game stays); a paid Apple Developer account makes it a year. [AltStore](https://altstore.io) works too and can refresh it for you.

          Singleplayer works offline. For multiplayer and syncing with the web version, join a Hustlefront server from the Play tab.
          EOF
          gh release delete hustlefront-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release delete cashclash-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true # the old names' releases
          gh release delete dawnshift-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create hustlefront-latest out/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Hustlefront (build $RUN)" \
            --notes-file notes.md

  # Compiles the Xcode project from the export job into an unsigned iPhone app (.ipa) and adds it to the
  # release. Unsigned because signing needs an Apple account: you sign it with yours as you install it.
  iphone:
    needs: export
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hustlefront-ios-project
          path: ios

      - name: Build the iPhone app
        working-directory: ios
        shell: bash
        run: |
          proj=$(ls -d *.xcodeproj | head -1)
          name=$(basename "$proj" .xcodeproj)
          xcodebuild -project "$proj" -scheme "$name" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath dd -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
          mkdir Payload
          cp -R "dd/Build/Products/Release-iphoneos/$name.app" Payload/
          zip -qry ../Hustlefront-iPhone.ipa Payload
          ls -la ..

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload hustlefront-latest Hustlefront-iPhone.ipa --clobber -R "$GITHUB_REPOSITORY"
